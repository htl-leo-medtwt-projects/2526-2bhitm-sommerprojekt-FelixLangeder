<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schloss der Finsternis</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <link rel="icon" href="img/icon.jpg">
</head>

<body onclick="bgMusic()">

    <div id="lp">
        <nav id="nav">
            <img id="lpButton" onclick="leaderboard(), windSound()" src="img/leaderboard.png" alt="leaderboard">
            <img id="lpButton" onclick="startGame(), windSound()" src="img/start-button.png" alt="start">
            <img id="lpButton" onclick="howTo(), windSound()" src="img/how-to.png" alt="how-to">
        </nav>
    </div>

    <div id="levels" style="display: none;">
        <img class="back" onclick="lp(), windSound()" src="img/back.png" alt="back" id="lpButton">
        <input type="text" placeholder="Wie heißt du?" id="nameInput">
        <div id="levelChoice">
            <img class="lpButton" onclick="startLv1(), windSound()" src="img/lv1s.jpg" alt="Level1">
            <img class="lpButton" onclick="startLv2(), windSound()" src="img/lv2s.jpg" alt="Level2">
            <img class="lpButton" onclick="startLv3(), windSound()" src="img/lv3s.jpg" alt="Level3">
        </div>
        <img id="lCheckpoint" class="lpButton"
            onclick="loadCheckpoint(), windSound(), setPlayerName(document.getElementById('nameInput').value)"
            src="img/lastCheckp.png" alt="load Checkpoint">
    </div>

    <div style="display: none;" id="leaderboard">
        <div id="leaderboardLevels">
            <img class="leaderboardImg" src="img/lv1.jpg" alt="Level1">
            <img src="img/lv2.jpg" alt="Level2" class="leaderboardImg">
            <img src="img/lv3.jpg" alt="Level3" class="leaderboardImg">
        </div>
        <img class="back" onclick="lp(), windSound()" src="img/back.png" alt="back" id="lpButton">
    </div>

    <div id="howTo" style="display: none;">
        <div id="howToInfo"><img src="img/box.jpg" alt="Box">
            <p id="info"></p>
        </div>
        <img class="back" onclick="lp(), windSound()" src="img/back.png" alt="back" id="lpButton">
    </div>

    <div id="level1" style="display: none;">
        <div class="description">
            <h2>Level 1 - Das Erwachen</h2>
            <p class="infoL" id="info1"></p>
        </div>
        <img src="img/rStart.jpg" onclick="goIn1(), windSound(), type('Willkommen im Schloss! Sieh dich mal um!')" alt="Betrete das Schloss" class="lpButton">
    </div>

    <div id="level2" style="display: none;">
        <div class="description">
            <h2>Level 2 - Die Schattenkorridore</h2>
            <p id="info2"></p>
        </div>
        <img src="img/rStart.jpg" onclick="goIn2(), windSound()" alt="Betrete das Schloss" class="lpButton">
    </div>

    <div id="level3" style="display: none;">
        <div class="description">
            <h2>Level 3 - Das Herz der Finsternis</h2>
            <p id="info3"></p>
        </div>
        <img src="img/rStart.jpg" onclick="goIn3(), windSound()" alt="Betrete das Schloss" class="lpButton">
    </div>

    <script>
        function typeHowTo() {
            const typed = new Typed('#info', {
                strings: [`<i>In Schloss der Finsternis erwachst du allein in einem kalten, verlassenen Gemäuer, dessen Wände
                zu flüstern scheinen und dessen Schatten sich bewegen, wenn du nicht hinsiehst. Jeder Raum birgt ein
                Geheimnis - und vielleicht etwas, das dich beobachtet. Mit jedem Klick öffnest du knarrende Türen,
                sammelst seltsame Artefakte und setzt Hinweise zusammen, doch die Dunkelheit arbeitet gegen dich.
                Stimmen aus der Ferne, rätselhafte Gestalten und verstörende Begegnungen mit den Bewohnern des Schlosses
                lassen dich an deinem Verstand zweifeln. Und irgendwo in den endlosen Gängen lauert der Graf… geduldig,
                lauernd, immer näher kommend. Ein falscher Schritt, ein Moment zu lange gezögert - und du spürst seinen
                Atem im Nacken, bevor dich die Finsternis verschlingt und dich zurückwirft. Nur wer stark genug ist, den
                Schrecken zu widerstehen und das dunkle Geheimnis zu lüften, hat eine Chance, diesem Albtraum zu
                entkommen.</i>`],
                typeSpeed: 20,
            });
        }

        function type1() {
            const typed = new Typed('#info1', {
                strings: [`<i>Du erwachst in einem kalten, schwach beleuchteten Raum, ohne zu wissen, wie du hierhergekommen bist. Die Luft ist schwer, und aus den dunklen Ecken scheinen dich unsichtbare Augen zu beobachten. Dieses erste Level dient dazu, dich mit den Mechaniken des Schlosses vertraut zu machen – doch unterschätze es nicht. Einfache Rätsel, versteckte Hinweise und erste Begegnungen mit seltsamen Gestalten fordern deinen Verstand heraus. Die Schritte des Grafen sind hier noch fern, doch manchmal glaubst du, ein leises Flüstern oder ein entferntes Knarren hinter dir zu hören. Mit mehreren Hinweisen und häufigen Checkpoints hast du noch eine gewisse Sicherheit – aber das Gefühl, nicht allein zu sein, begleitet dich von Anfang an.</i>`],
                typeSpeed: 20,
            });
        }

        function type2() {
            const typed = new Typed('#info2', {
                strings: [`<i>Nachdem du das erste Zimmer überstanden hast, führen dich die Gänge tiefer in das Schloss. Die
                Schatten werden länger, die Türen knarren unheilvoll, und die Geräusche verstärken das Gefühl, dass dich jemand
                beobachtet. Rätsel werden komplexer und erfordern kombinatorisches Denken und Aufmerksamkeit für
                Details. Die NPCs, denen du begegnest, geben Hinweise, doch nicht alle sind vertrauenswürdig - manche
                versuchen, dich in die Irre zu führen. Der Graf ist jetzt unberechenbarer: Er taucht plötzlich auf, wenn
                du Fehler machst oder zu lange zögerst. Checkpoints und Hinweise sind seltener, sodass jeder Schritt
                wohlüberlegt sein muss, um nicht ins Dunkel zurückgeworfen zu werden.</i>`],
                typeSpeed: 20,
            });
        }

        function type3() {
            const typed = new Typed('#info3', {
                strings: [`<i>Du bist tief im Schloss angekommen, in Bereichen, die von Dunkelheit und Bedrohung durchdrungen sind. Die
                Rätsel sind knifflig und erfordern volle Konzentration und Mut, während die Atmosphäre dich in den
                Wahnsinn zu treiben scheint. Der Graf ist ständig präsent, seine Schritte hallen durch die Gänge, und
                jede falsche Entscheidung kann dich zurückwerfen. NPCs sind kaum noch zu finden, Hinweise extrem rar.
                Hier entscheidet sich, ob du das Geheimnis des Schlosses wirklich lüften und entkommen kannst. Jeder
                Schatten, jedes Geräusch kann dein letzter Fehler sein - nur wer Ruhe bewahrt, logisch denkt und den Mut
                nicht verliert, überlebt den Herzschlag der Finsternis.</i>`],
                typeSpeed: 20,
            });
        }

        function type(string) {
            const typed = new Typed('#tipBox', {
                strings: [`<i>${string}</i>`],
                typeSpeed: 20,
            });
        }
    </script>

    <div style="display: none;" id="rLevel1">
        <img src="img/hebel.png" onclick="changeHebel()" id="hebel" alt="Hebel">
        <div class="clickBox hover" onclick="onext()" id="click1"></div>
        <div class="clickBox hover" onclick="o2next()" style="display: none;" id="click2"></div>
        <div class="hover" id="backBox" onclick="backBox()" style="display: none; justify-content: center;">
            <img src="img/arrow.png" alt="Pfeil"
                style="transform: rotate(270deg); margin: auto; width: 3rem; position: relative; top: 2vh;">
        </div>
        <div id="endscreen1" style="display: none;">
            <h1>Herzlichen Glückwunsch</h1>
            <p>Du bist aus dem Schloss entkommen</p>
            <img src="img/back.jpg" class="lpButton" alt="back-Button" onclick="location.reload()">
        </div>
    </div>

    <div style="display: none;" id="rLevel2">

        <div id="grafScreen2" style="display:none;">
            <img src="img/graf.png" id="grafImg2" alt="">
        </div>

        <div id="codePanel2" style="display:none;">
            <input type="text" maxlength="5" id="codeInput2" placeholder="Code">
            <button onclick="checkCode2()">Öffnen</button>
        </div>

        <div class="clickBox hover" onclick="nextLevel2()" id="clickL2_1"></div>

        <div class="clickBox hover" onclick="nextLevel2Room()" style="display:none;" id="clickL2_2"></div>

        <div class="clickBox hover" onclick="bedroom2()" style="display:none;" id="clickL2_3"></div>

        <div class="clickBox hover" onclick="gang2()" style="display:none;" id="clickL2_4"></div>

        <div class="clickBox hover" onclick="door2()" style="display:none;" id="clickL2_5"></div>

        <div class="hover" id="backBox" onclick="backLevel2()" style="justify-content:center;">

            <img src="img/arrow.png" alt="Pfeil" style="transform: rotate(270deg); display: block;
            margin:auto;
            width:3rem;
            position:relative;
            top:2vh;">
        </div>

        <div id="endscreen2" style="display:none;">
            <h1>Du bist entkommen...</h1>
            <p>Aber der Graf lebt noch.</p>
            <img src="img/back.jpg" class="lpButton" alt="back-Button" onclick="location.reload()">
        </div>

    </div>
    <div style="display: none;" id="rLevel3"></div>

    <div id="blackBox" class="fromBlack" style="display: block;"></div>
    <div id="audioBox"></div>
    <div class="tipBox" id="tipBox" style="display: none;"></div>

    <div id="preloader">
        <img src="img/1.1.png" alt="1.1">
        <img src="img/1.floor.webp" alt="floor">
        <img src="img/arrow.png" alt="arrow">
        <img src="img/back.jpg" alt="back">
        <img src="img/back.png" alt="back">
        <img src="img/bg.webp" alt="bg">
        <img src="img/bg-leaderboard.webp" alt="leaderboard bg">
        <img src="img/box.jpg" alt="box">
        <img src="img/checkpoint.jpg" alt="checkpoint">
        <img src="img/comte.webp" alt="comte">
        <img src="img/halle.jpg" alt="halle">
        <img src="img/hebel.png" alt="hebel">
        <img src="img/how-to.jpg" alt="how-to">
        <img src="img/how-to.png" alt="how-to">
        <img src="img/how-to-bg.webp" alt="how-to-bg">
        <img src="img/icon.jpg" alt="icon">
        <img src="img/icon.webp" alt="icon">
        <img src="img/lastCheckp.png" alt="last checkpoint">
        <img src="img/leaderboard.png" alt="leaderboard">
        <img src="img/levels-bg.webp" alt="levels bg">
        <img src="img/lv1.jpg" alt="level 1">
        <img src="img/lv1s.jpg" alt="level 1s">
        <img src="img/lv2.jpg" alt="level 2">
        <img src="img/lv2s.jpg" alt="level 2s">
        <img src="img/lv3.jpg" alt="level 3">
        <img src="img/lv3s.jpg" alt="level 3s">
        <img src="img/notiz.webp" alt="notiz">
        <img src="img/pergament.png" alt="pergament">
        <img src="img/place.jpg" alt="place">
        <img src="img/placeholder.jpg" alt="placeholder">
        <img src="img/rStart.jpg" alt="restart">
        <img src="img/secret.webp" alt="secret">
        <img src="img/start-button.png" alt="start button">
        <img src="img/startscreen.webp" alt="startscreen">
        <img src="img/tor.jpg" alt="tor">
        <img src="img/türC.png" alt="tür geschlossen">
        <img src="img/türO.png" alt="tür offen">
        <img src="img/arbeitszimmer.jpg" alt="arbeitszimmer">
        <img src="img/arbeitszimmerO.jpg" alt="arbeitszimmer offen">
    </div>
</body>

</html>
